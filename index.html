<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoQuest - Învață să reciclezi!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>♻️ EcoQuest</h1>
        <p>Învață să reciclezi și să protejezi planeta!</p>
    </header>

    <main id="continut">
        <h2>Bine ai venit!</h2>

        <p>
            Descoperă lumea reciclării, răspunde la întrebări
            și învață cum poți proteja mediul înconjurător!
        </p>

        <p id="scor">⭐ Scor: 0</p>

        <button id="start">Începe aventura!</button>

        <p id="intrebare"></p>

        <div id="raspunsuri"></div>

        <p id="mesaj"></p>
    </main>

    <footer>
        <p>EcoQuest - Proiect educațional despre reciclare ♻️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
